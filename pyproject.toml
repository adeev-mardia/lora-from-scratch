[project]
name = "lora-from-scratch"
version = "0.1.0"
description = "A from-scratch implementation of LoRA with a measured comparison against full fine-tuning and a frozen baseline."
authors = [
    { name = "Adeev Mardia" }
]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
lora-from-scratch = "lora_scratch.cli:main"

[tool.setuptools.packages.find]
include = ["lora_scratch*"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
